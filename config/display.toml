addr = "localhost:8760"
extaddr = "http://localhost:8760"
name = "ubbasel:display01"
#wsbroker = "https://localhost:8765"
wsbroker = "websocket-broker.k8s-tls.ub.unibas.ch"
channels = ["display"]
max_messages = 100

[ntp]
server = "wsbroker"
interval = "10m"
timeout = "5s"

[browser]
address = ""
start_url = "http://localhost:8760"
#start_url = "https://www.heise.de"
headless = false
kiosk = false
window_width = 1024
window_height = 768
ignore_cert_errors = true
custom_flags = ["test-type", "disable-features=Translate", "app=http://localhost:8760"]
timeout = "30s"

[clienttls]
type = "minivault"

[clienttls.minivault]
#baseurl = "https://localhost:8759/api/v1"
baseurl = "https://minivault.grpc-system.k8s.ub.unibas.ch/api/v1"
#parenttoken = "pa.22f09dfd1cbfbe9f.c17b29cb2b730533"
parenttoken = "%%PARENT_TOKEN%%"
tokentype = "client_cert"
tokenpolicies = ["wsbroker.client"]
certtype = "client_cert"
uris = ["wsbroker:client:ubbasel:display01", "wsbroker:channel:all:rw", "wsbroker:channel:intern:rw", "wsbroker:channel:display:rw"]
ca = ["certs/minivault.ca.pem", "certs/minivault_switch.ca.pem"]
usesystempool = false

[webtls]
type = "dev"
