components:
  schemas:
    displayclient.BrowserInfo:
      properties:
        address:
          type: string
        headless:
          type: boolean
        height:
          type: integer
        kiosk:
          type: boolean
        width:
          type: integer
      type: object
    displayclient.DashboardData:
      properties:
        addr:
          type: string
        arch:
          type: string
        browser:
          $ref: '#/components/schemas/displayclient.BrowserInfo'
        channels:
          items:
            type: string
          type: array
          uniqueItems: false
        client_name:
          type: string
        ext_addr:
          type: string
        go_version:
          type: string
        hostname:
          type: string
        messages:
          items:
            $ref: '#/components/schemas/displayclient.WSMessage'
          type: array
          uniqueItems: false
        ntp:
          $ref: '#/components/schemas/ntp.NTPStatus'
        os:
          type: string
        start_time:
          type: string
        tls_type:
          type: string
        uptime:
          type: string
        ws_broker:
          type: string
      type: object
    displayclient.WSMessage:
      properties:
        channel:
          type: string
        data:
          type: string
        direction:
          description: '"in" (received) or "out" (sent)'
          type: string
        id:
          type: string
        refID:
          type: string
        session:
          type: string
        source:
          type: string
        target:
          type: string
        timestamp:
          type: string
        type:
          description: '"message", "file", "ping", "pong", "attach", etc.'
          type: string
      type: object
    ntp.NTPStatus:
      properties:
        error:
          type: string
        last_sync:
          type: string
        leap_indicator:
          type: string
        offset:
          type: string
        offset_nanos:
          type: integer
        precision:
          type: string
        reference_id:
          type: string
        rtt:
          type: string
        rtt_nanos:
          type: integer
        server:
          type: string
        stratum:
          type: integer
        synced:
          type: boolean
        time:
          type: string
      type: object
    pkg_rest.WSMessage:
      properties:
        channel:
          type: string
        data:
          type: string
        direction:
          description: '"in" (received) or "out" (sent)'
          type: string
        id:
          type: string
        refID:
          type: string
        session:
          type: string
        source:
          type: string
        target:
          type: string
        timestamp:
          type: string
        type:
          description: '"message", "file", "ping", "pong", "attach", etc.'
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: juergen.enge@unibas.ch
    name: Jürgen Enge
    url: https://ub.unibas.ch
  description: WSBroker Display REST API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: WSBroker Display API
  version: "1.0"
openapi: 3.1.0
paths:
  /messages:
    get:
      description: returns rolling buffer of recent incoming and outgoing WebSocket
        messages
      operationId: get-messages
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/pkg_rest.WSMessage'
                type: array
          description: OK
      summary: get recent WebSocket message log
      tags:
      - wsbrokerdisplay
  /ntp:
    get:
      description: returns live NTP synchronization metrics and clock offset
      operationId: get-ntp
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ntp.NTPStatus'
          description: OK
      summary: get NTP synchronization status
      tags:
      - wsbrokerdisplay
  /ping:
    get:
      description: for testing if server is running
      operationId: get-ping
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
      summary: does pong
      tags:
      - wsbrokerdisplay
  /status:
    get:
      description: returns comprehensive dashboard telemetry, metadata, and NTP synchronization
        status
      operationId: get-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/displayclient.DashboardData'
          description: OK
      summary: get display status and system metadata
      tags:
      - wsbrokerdisplay
servers:
- description: WSBroker Display API base path
  url: /api/v1
